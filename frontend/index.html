<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直链文件传输助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="upload-box">
            <h1>直链文件传输助手</h1>
            <p class="subtitle">支持最大10GB文件上传，生成永久直链供下载</p>
            
            <div id="uploadArea">
                <div class="upload-icon">+</div>
                <div class="upload-text">点击或拖拽文件到此处上传</div>
                <div class="upload-hint">支持所有格式文件上传，最大10GB</div>
            </div>
            <input type="file" id="fileInput" accept="*">
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">上传中...</div>
            </div>
            
            <div class="uploaded-info" id="uploadedInfo">
                <p><strong>文件名:</strong> <span id="fileName"></span></p>
                <p><strong>文件大小:</strong> <span id="fileSize"></span></p>
            </div>
            
            <div class="result" id="result"></div>
            
            <div class="nav-links">
                <a href="manage.html">文件管理</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
